<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - Product HUD</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #333;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.back-btn {
    text-decoration: none;
    background: #333;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input[type="text"],
input[type="file"] {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.save-btn {
    background: #1877f2;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.category-card {
    border: 1px solid #ddd;
    padding: 20px;
    border-radius: 12px;
    margin-top: 15px;
}

.category-card img {
    width: 180px;
    height: 140px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin-bottom: 12px;
}

.edit-btn,
.delete-btn {
    padding: 9px 14px;
    border-radius: 7px;
    border: 1px solid #ccc;
    cursor: pointer;
    margin-right: 8px;
}

.edit-btn {
    background: #fff;
}

.delete-btn {
    background: #fff;
}

#deletePopup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.popup-box {
    background: white;
    width: 320px;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
}

.yes-btn {
    background: #e53935;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 8px;
}

.no-btn {
    background: #777;
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📁 Categories</h1>

        <a href="admin.html" class="back-btn">
            ← Dashboard
        </a>
    </div>


    <!-- ADD / EDIT CATEGORY -->

    <div class="box">

        <h2>➕ Add Category</h2>

        <input
            type="text"
            id="categoryName"
            placeholder="Enter category name"
        >

        <input
            type="file"
            id="categoryImage"
            accept="image/*"
        >

        <div id="existingCategoryImage"></div>

        <button
            class="save-btn"
            id="saveCategoryBtn"
        >
            💾 Save Category
        </button>

    </div>


    <!-- UPLOADED CATEGORY -->

    <div class="box">

        <h2>📁 Uploaded Category / Edit Category</h2>

        <div id="categoryList"></div>

    </div>

</div>


<!-- DELETE POPUP -->

<div id="deletePopup">

    <div class="popup-box">

        <h3>⚠️ Delete Category?</h3>

        <p>
            Are you sure you want to delete this category?
        </p>

        <button
            class="yes-btn"
            onclick="confirmDeleteCategory()"
        >
            Yes
        </button>

        <button
            class="no-btn"
            onclick="closeDeletePopup()"
        >
            No
        </button>

    </div>

</div>


<script>

let categories =
    JSON.parse(localStorage.getItem("adminCategories")) || [];

let editIndex = -1;
let deleteIndex = -1;


/* SHOW CATEGORIES */

function displayCategories() {

    const list =
        document.getElementById("categoryList");

    list.innerHTML = "";

    if (categories.length === 0) {

        list.innerHTML =
            "<p>No Categories Added Yet.</p>";

        return;
    }


    categories.forEach(function(category, index) {

        const card =
            document.createElement("div");

        card.className = "category-card";


        card.innerHTML = `

            ${
                category.image
                ?
                `<img src="${category.image}"
                      alt="Category Image">`
                :
                `<p>📷 No Category Image</p>`
            }

            <h3>
                ${category.name || "Category Name"}
            </h3>

            <button
                class="edit-btn"
                onclick="editCategory(${index})"
            >
                ✏️ Edit Category
            </button>

            <bu<button
  class="delete-btn"
  onclick="deleteCategory(${index})"
>
  🗑️ Delete Category
</button>tton
                class="delete-btn"
                onclick="deleteCategory(${index})"
            >
                🗑️ Delete Category
            </button>

        `;

        list.appendChild(card);

    });

}


/* SAVE CATEGORY */

document
.getElementById("saveCategoryBtn")
.addEventListener("click", function() {

    const name =
        document.getElementById("categoryName").value.trim();

    const imageFile =
        document.getElementById("categoryImage").files[0];


    if (!name) {

        alert("Please enter category name.");

        return;
    }


    function saveCategory(image) {

        const category = {

            name: name,

            image: image || ""

        };


        if (editIndex >= 0) {

            categories[editIndex] = category;

            editIndex = -1;

        } else {

            categories.push(category);

        }


        localStorage.setItem(
            "adminCategories",
            JSON.stringify(categories)
        );


        alert("Category saved successfully!");


        document
        .getElementById("categoryName")
        .value = "";

        document
        .getElementById("categoryImage")
        .value = "";

        document
        .getElementById("existingCategoryImage")
        .innerHTML = "";


        displayCategories();

    }


    if (imageFile) {

        const reader =
            new FileReader();

        reader.onload = function() {

            saveCategory(reader.result);

        };

        reader.readAsDataURL(imageFile);

    } else {

        let oldImage = "";

        if (editIndex >= 0) {

            oldImage =
                categories[editIndex].image || "";

        }

        saveCategory(oldImage);

    }

});


/* EDIT CATEGORY */

function editCategory(index) {

    editIndex = index;

    const category =
        categories[index];


    document
    .getElementById("categoryName")
    .value = category.name || "";


    if (category.image) {

        document
        .getElementById("existingCategoryImage")
        .innerHTML = `

            <p><strong>Current Category Image:</strong></p>

            <img
                src="${category.image}"
                style="
                    width:180px;
                    height:140px;
                    object-fit:cover;
                    border-radius:10px;
                    margin-bottom:15px;
                "
            >

        `;

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* DELETE CATEGORY */

function deleteCategory(index) {

    deleteIndex = index;

    document
    .getElementById("deletePopup")
    .style.display = "flex";

}


/* CLOSE POPUP */

function closeDeletePopup() {

    deleteIndex = -1;

    document
    .getElementById("deletePopup")
    .style.display = "none";

}


/* CONFIRM DELETE */

function confirmDeleteCategory() {

    if (deleteIndex >= 0) {

        categories.splice(deleteIndex, 1);

        localStorage.setItem(
            "adminCategories",
            JSON.stringify(categories)
        );

        closeDeletePopup();

        displayCategories();

    }

}


/* FIRST LOAD */

displayCategories();
function deleteCategory(index) {
  deleteIndex = index;

  document.getElementById("deletePopup").style.display = "flex";
}

function closeDeletePopup() {
  document.getElementById("deletePopup").style.display = "none";
}

function confirmDeleteCategory() {
  if (deleteIndex === -1) return;

  categories.splice(deleteIndex, 1);

  localStorage.setItem(
    "adminCategories",
    JSON.stringify(categories)
  );

  deleteIndex = -1;

  closeDeletePopup();

  displayCategories();
}
displayCategories();
</script>

</body>
</html>

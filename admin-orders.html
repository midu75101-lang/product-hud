<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders - Product HUD</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <!-- Admin Login Check -->
  <script>
    (async function () {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
      }

    })();
  </script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      background: #111827;
      color: white;
      padding: 20px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;
    }

    .header h1 {
      font-size: 24px;
    }


    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }


    .back-btn,
    .refresh-btn {

      color: white;
      text-decoration: none;

      border: none;

      padding: 10px 16px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      font-size: 14px;
    }


    .back-btn {
      background: #2563eb;
    }


    .refresh-btn {
      background: #374151;
    }


    .back-btn:hover {
      background: #1d4ed8;
    }


    .refresh-btn:hover {
      background: #4b5563;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {

      max-width: 900px;

      margin: 30px auto;

      padding: 20px;
    }


    .orders-container {

      display: grid;

      gap: 20px;
    }


    /* =========================
       ORDER CARD
    ========================= */

    .order-card {

      background: white;

      padding: 22px;

      border-radius: 14px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.06);
    }


    .order-card h2 {

      color: #111827;

      margin-bottom: 15px;
    }


    /* =========================
       PRODUCT
    ========================= */

    .product-box {

      display: flex;

      gap: 15px;

      align-items: center;

      padding: 15px;

      background: #f9fafb;

      border-radius: 10px;

      margin-bottom: 15px;
    }


    .product-box img {

      width: 90px;

      height: 90px;

      object-fit: cover;

      border-radius: 10px;

      background: #e5e7eb;
    }


    .product-box h3 {

      color: #111827;

      margin-bottom: 7px;
    }


    .product-box p {

      color: #374151;
    }


    /* =========================
       CUSTOMER DETAILS
    ========================= */

    .customer-info {

      color: #4b5563;

      line-height: 1.8;

      margin-bottom: 15px;
    }


    .customer-info strong {

      color: #111827;

      font-size: 17px;
    }


    /* =========================
       STATUS
    ========================= */

    .status {

      display: inline-block;

      background: #f59e0b;

      color: white;

      padding: 6px 12px;

      border-radius: 20px;

      font-size: 13px;

      font-weight: bold;

      margin-bottom: 15px;
    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp-btn {

      display: inline-block;

      background: #16a34a;

      color: white;

      text-decoration: none;

      border: none;

      padding: 11px 16px;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }


    .whatsapp-btn:hover {

      background: #15803d;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

      background: white;

      padding: 50px;

      text-align: center;

      border-radius: 14px;

      color: #6b7280;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.05);
    }


    /* =========================
       ERROR
    ========================= */

    .error {

      background: #fee2e2;

      color: #991b1b;

      padding: 20px;

      border-radius: 12px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {

        padding: 18px;

        flex-direction: column;

        align-items: flex-start;
      }


      .header h1 {

        font-size: 22px;
      }


      .header-buttons {

        width: 100%;

        flex-wrap: wrap;
      }


      .back-btn,
      .refresh-btn {

        font-size: 13px;

        padding: 9px 12px;
      }


      .container {

        padding: 15px;

        margin: 15px auto;
      }


      .order-card {

        padding: 18px;
      }


      .product-box {

        flex-direction: column;

        align-items: flex-start;
      }


      .product-box img {

        width: 100%;

        max-width: 180px;

        height: 180px;
      }


      .whatsapp-btn {

        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <h1>🛒 Orders</h1>


    <div class="header-buttons">

      <button
        class="refresh-btn"
        onclick="displayOrders()"
      >
        🔄 Refresh
      </button>


      <a
        href="admin.html"
        class="back-btn"
      >
        ← Dashboard
      </a>

    </div>

  </header>


  <!-- =========================
       ORDERS
  ========================= -->

  <main class="container">

    <div
      id="ordersContainer"
      class="orders-container"
    ></div>

  </main>


  <script>


    /*
    ==========================================
       SUPABASE ORDERS
    ==========================================
    */

    let supabaseOrders = [];


    /*
    ==========================================
       DISPLAY ORDERS
    ==========================================
    */

    async function displayOrders() {

      const container =
        document.getElementById(
          "ordersContainer"
        );


      container.innerHTML = `

        <div class="empty">

          <h2>⏳ Loading Orders...</h2>

          <p>Please wait.</p>

        </div>

      `;


      try {


        /*
        ==========================================
           GET ORDERS FROM SUPABASE
        ==========================================
        */

        const {
          data,
          error
        } = await supabaseClient

          .from("orders")

          .select("*")

          .order(
            "created_at",
            {
              ascending: false
            }
          );


        /*
        ==========================================
           ERROR
        ==========================================
        */

        if (error) {

          console.error(
            "Supabase Orders Error:",
            error
          );


          container.innerHTML = `

            <div class="error">

              <h2>
                ❌ Could not load orders
              </h2>

              <br>

              <p>
                ${error.message}
              </p>

            </div>

          `;

          return;
        }


        /*
        ==========================================
           STORE SUPABASE ORDERS
        ==========================================
        */

        supabaseOrders =
          data || [];


        /*
        ==========================================
           NO ORDERS
        ==========================================
        */

        if (
          supabaseOrders.length === 0
        ) {

          container.innerHTML = `

            <div class="empty">

              <h2>
                📭 No Orders Yet
              </h2>

              <br>

              <p>
                Customer orders will appear here.
              </p>

            </div>

          `;

          return;
        }


        /*
        ==========================================
           CLEAR CONTAINER
        ==========================================
        */

        container.innerHTML = "";


        /*
        ==========================================
           DISPLAY EACH ORDER
        ==========================================
        */

        supabaseOrders.forEach(
          function(order, index) {


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "order-card";


            /*
            ======================================
               PRODUCT IMAGE
            ======================================
            */

            const productImage =
              order.product_image || "";


            /*
            ======================================
               PRODUCT NAME
            ======================================
            */

            const productName =
              order.product_name ||
              "Product";


            /*
            ======================================
               PRICE
            ======================================
            */

            const productPrice =
              order.product_price ??
              0;


            /*
            ======================================
               CUSTOMER
            ======================================
            */

            const customerName =
              order.customer_name ||
              "Not provided";


            /*
            ======================================
               PHONE
            ======================================
            */

            const customerPhone =
              order.customer_phone ||
              "Not provided";


            /*
            ======================================
               ADDRESS
            ======================================
            */

            const address =
              order.address ||
              "Not provided";


            /*
            ======================================
               CITY
            ======================================
            */

            const city =
              order.city ||
              "Not provided";


            /*
            ======================================
               PIN
            ======================================
            */

            const pin =
              order.pin ||
              "Not provided";


            /*
            ======================================
               PAYMENT
            ======================================
            */

            const paymentMethod =
              order.payment_method ||
              "Not provided";


            /*
            ======================================
               STATUS
            ======================================
            */

            const status =
              order.status ||
              "New Order";


            /*
            ======================================
               DATE
            ======================================
            */

            let orderDate =
              "Not available";


            if (order.created_at) {

              orderDate =
                new Date(
                  order.created_at
                ).toLocaleString();

            }


            /*
            ======================================
               CARD HTML
            ======================================
            */

            card.innerHTML = `

              <h2>
                Order #${index + 1}
              </h2>


              <div class="product-box">


                <img
                  src="${productImage}"
                  alt="Product"
                  onerror="
                    this.style.display='none';
                  "
                >


                <div>

                  <h3>
                    ${productName}
                  </h3>


                  <p>
                    Price:
                    ₹${productPrice}
                  </p>

                </div>

              </div>


              <div class="customer-info">


                <strong>
                  Customer Details
                </strong>


                <br><br>


                Name:
                ${customerName}


                <br>


                Phone:
                ${customerPhone}


                <br>


                Address:
                ${address}


                <br>


                City:
                ${city}


                <br>


                PIN:
                ${pin}


                <br>


                Payment:
                ${paymentMethod}


                <br>


                Date:
                ${orderDate}

              </div>


              <span class="status">

                ${status}

              </span>


              <br>


              <button
                class="whatsapp-btn"
                onclick="sendWhatsApp(${index})"
              >

                📱 Send WhatsApp

              </button>


            `;


            container.appendChild(
              card
            );


          }
        );


      }

      catch (error) {


        console.error(
          "Order Loading Error:",
          error
        );


        container.innerHTML = `

          <div class="error">

            <h2>
              ❌ Order loading failed
            </h2>

            <br>

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    /*
    ==========================================
       WHATSAPP
    ==========================================
    */

    function sendWhatsApp(index) {


      const order =
        supabaseOrders[index];


      if (!order) {

        alert(
          "Order not found."
        );

        return;

      }


      /*
      ==========================================
         WHATSAPP NUMBER
      ==========================================
      */

      const whatsappNumber =
        localStorage.getItem(
          "whatsappNumber"
        );


      if (!whatsappNumber) {

        alert(
          "Please save your WhatsApp number first."
        );

        return;

      }


      /*
      ==========================================
         ORDER DATA
      ==========================================
      */

      const productName =
        order.product_name ||
        "Product";


      const productPrice =
        order.product_price ??
        0;


      const customerName =
        order.customer_name ||
        "Not provided";


      const customerPhone =
        order.customer_phone ||
        "Not provided";


      const address =
        order.address ||
        "Not provided";


      const city =
        order.city ||
        "";


      const pin =
        order.pin ||
        "Not provided";


      const paymentMethod =
        order.payment_method ||
        "Not provided";


      /*
      ==========================================
         MESSAGE
      ==========================================
      */

      const message =
`New Product HUD Order

Order: #${index + 1}

Product: ${productName}
Price: ₹${productPrice}

Customer Name: ${customerName}
Phone: ${customerPhone}

Address:
${address}
${city}

PIN: ${pin}

Payment Method: ${paymentMethod}`;


      /*
      ==========================================
         WHATSAPP URL
      ==========================================
      */

      const url =
        "https://wa.me/" +

        whatsappNumber.replace(
          /\D/g,
          ""
        ) +

        "?text=" +

        encodeURIComponent(
          message
        );


      window.open(
        url,
        "_blank"
      );

    }


    /*
    ==========================================
       START
    ==========================================
    */

    displayOrders();


  </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
(async function () {

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
  }

})();
</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products - Product HUD</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1e293b;
    }

    .topbar {
      background: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .topbar h1 {
      margin: 0;
      font-size: 26px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
    }

    .dashboard-btn {
      background: #64748b;
      color: white;
    }

    .dashboard-btn:hover {
      background: #475569;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      margin-bottom: 20px;
    }

    .section-title h2 {
      margin: 0 0 5px 0;
      font-size: 22px;
    }

    .section-title p {
      margin: 0;
      color: #64748b;
    }

    #productList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      border: 1px solid #e5e7eb;
    }

    .product-image {
      width: 100%;
      height: 230px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .no-image {
      width: 100%;
      height: 230px;
      background: #f1f5f9;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .product-card h3 {
      margin: 5px 0 12px;
      font-size: 20px;
    }

    .product-info {
      line-height: 1.7;
      font-size: 14px;
    }

    .product-info strong {
      color: #334155;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #eef2ff;
      color: #3730a3;
    }

    .gallery {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .gallery img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .edit-btn {
      background: #f59e0b;
      color: white;
    }

    .edit-btn:hover {
      background: #d97706;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .view-btn {
      background: #0f766e;
      color: white;
    }

    .view-btn:hover {
      background: #115e59;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 60px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .empty h3 {
      margin-bottom: 8px;
    }

    .empty p {
      color: #64748b;
    }

    /* POPUP */

    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .popup-box {
      background: white;
      width: 420px;
      max-width: 100%;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
    }

    .popup-box h3 {
      margin-top: 0;
    }

    .popup-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .yes-btn {
      background: #dc2626;
      color: white;
    }

    .no-btn {
      background: #64748b;
      color: white;
    }

    /* EDIT MODAL */

    .edit-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 20px;
      overflow-y: auto;
    }

    .edit-box {
      background: white;
      width: 700px;
      max-width: 100%;
      padding: 25px;
      border-radius: 14px;
      margin: 20px auto;
    }

    .edit-box h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 10px;
    }

    .status-row label {
      font-weight: normal;
    }

    .status-row input {
      width: auto;
    }

    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-btn {
      background: #64748b;
      color: white;
    }

    .save-edit-btn {
      background: #2563eb;
      color: white;
    }

    /* VIEW MODAL */

    .view-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 20px;
    }

    .view-box {
      background: white;
      width: 650px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      border-radius: 14px;
    }

    .view-box h2 {
      margin-top: 0;
    }

    .view-main-image {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .view-gallery {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .view-gallery img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
    }

  </style>

</head>

<body>

  <!-- TOP BAR -->

  <div class="topbar">

    <h1>📦 Products</h1>

    <div class="top-buttons">

      <a
        href="admin.html"
        class="btn dashboard-btn"
      >
        ← Dashboard
      </a>

      <a
        href="admin-add-product.html"
        class="btn add-btn"
      >
        + Add Product
      </a>

    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="container">

    <div class="section-title">

      <h2>📦 Uploaded Products</h2>

      <p>
        All products added from the Admin panel
      </p>

    </div>

    <div id="productList"></div>

  </div>


  <!-- DELETE POPUP -->

  <div
    id="deletePopup"
    class="popup"
  >

    <div class="popup-box">

      <h3>⚠️ Delete Product?</h3>

      <p>
        Are you sure you want to delete this product?
      </p>

      <div class="popup-actions">

        <button
          class="btn yes-btn"
          onclick="confirmDelete()"
        >
          Yes, Delete
        </button>

        <button
          class="btn no-btn"
          onclick="closeDeletePopup()"
        >
          No
        </button>

      </div>

    </div>

  </div>


  <!-- EDIT MODAL -->

  <div
    id="editModal"
    class="edit-modal"
  >

    <div class="edit-box">

      <h2>✏️ Edit Product</h2>

      <div class="form-group">

        <label>Product Name</label>

        <input
          id="editName"
          type="text"
        >

      </div>


      <div class="form-group">

        <label>Price</label>

        <input
          id="editPrice"
          type="number"
        >

      </div>


      <div class="form-group">

        <label>Discount (%)</label>

        <input
          id="editDiscount"
          type="number"
        >

      </div>


      <div class="form-group">

        <label>Estimated Profit</label>

        <input
          id="editProfit"
          type="text"
        >

      </div>


      <div class="form-group">

        <label>Category</label>

        <select id="editCategory">

          <option value="Home & Kitchen">
            Home & Kitchen
          </option>

          <option value="Gadgets">
            Gadgets
          </option>

          <option value="Wood Products">
            Wood Products
          </option>

          <option value="Trending">
            Trending
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Rating</label>

        <input
          id="editRating"
          type="number"
          step="0.1"
          min="0"
          max="5"
        >

      </div>


      <div class="form-group">

        <label>Description</label>

        <textarea id="editDescription"></textarea>

      </div>


      <div class="form-group">

        <label>Change Product Image</label>

        <input
          id="editImage"
          type="file"
          accept="image/*"
        >

      </div>


      <div class="form-group">

        <label>Change Gallery Images</label>

        <input
          id="editGallery"
          type="file"
          accept="image/*"
          multiple
        >

      </div>


      <div class="form-group">

        <label>Product Status</label>

        <div class="status-row">

          <label>
            <input
              type="checkbox"
              id="editTrending"
            >
            🔥 Trending
          </label>

          <label>
            <input
              type="checkbox"
              id="editHot"
            >
            🔥 Hot
          </label>

          <label>
            <input
              type="checkbox"
              id="editNewest"
            >
            🆕 Newest
          </label>

        </div>

      </div>


      <div class="edit-actions">

        <button
          class="btn cancel-btn"
          onclick="closeEditModal()"
        >
          Cancel
        </button>

        <button
          class="btn save-edit-btn"
          onclick="saveEditedProduct()"
        >
          💾 Save Changes
        </button>

      </div>

    </div>

  </div>


  <!-- VIEW MODAL -->

  <div
    id="viewModal"
    class="view-modal"
  >

    <div class="view-box">

      <h2 id="viewName"></h2>

      <img
        id="viewImage"
        class="view-main-image"
        src=""
        alt="Product Image"
      >

      <div
        id="viewGallery"
        class="view-gallery"
      ></div>

      <p>
        <strong>Price:</strong>
        <span id="viewPrice"></span>
      </p>

      <p>
        <strong>Discount:</strong>
        <span id="viewDiscount"></span>
      </p>

      <p>
        <strong>Estimated Profit:</strong>
        <span id="viewProfit"></span>
      </p>

      <p>
        <strong>Category:</strong>
        <span id="viewCategory"></span>
      </p>

      <p>
        <strong>Rating:</strong>
        <span id="viewRating"></span>
      </p>

      <p>
        <strong>Description:</strong>
        <span id="viewDescription"></span>
      </p>

      <p>
        <strong>Status:</strong>
        <span id="viewStatus"></span>
      </p>

      <button
        class="btn cancel-btn"
        onclick="closeViewModal()"
      >
        Close
      </button>

    </div>

  </div>


<script>

  /* =========================================
     PRODUCT DATA
  ========================================= */

  let products =
    JSON.parse(
      localStorage.getItem("adminProducts")
    ) || [];


  /*
    OLD DATA COMPATIBILITY

    If an old product exists only in
    adminProduct, move it into adminProducts.
  */

  const oldProduct =
    JSON.parse(
      localStorage.getItem("adminProduct")
    );


  if (
    products.length === 0 &&
    oldProduct
  ) {

    if (!oldProduct.id) {
      oldProduct.id = Date.now();
    }

    products.push(oldProduct);

    localStorage.setItem(
      "adminProducts",
      JSON.stringify(products)
    );

  }


  /* =========================================
     DISPLAY PRODUCTS
  ========================================= */

  function displayProducts() {

    const productList =
      document.getElementById("productList");

    productList.innerHTML = "";


    if (
      !products ||
      products.length === 0
    ) {

      productList.innerHTML = `

        <div class="empty">

          <h3>📦 No Products Added Yet</h3>

          <p>
            Click "+ Add Product" to add your first product.
          </p>

        </div>

      `;

      return;
    }


    products.forEach(
      function(product, index) {

        const card =
          document.createElement("div");

        card.className =
          "product-card";


        let badges = "";


        if (product.trending) {

          badges += `
            <span class="badge">
              🔥 Trending
            </span>
          `;

        }


        if (product.hot) {

          badges += `
            <span class="badge">
              🔥 Hot
            </span>
          `;

        }


        if (product.newest) {

          badges += `
            <span class="badge">
              🆕 Newest
            </span>
          `;

        }


        let imageHTML = "";


        if (product.image) {

          imageHTML = `
            <img
              class="product-image"
              src="${product.image}"
              alt="${escapeHTML(product.name || "Product")}"
            >
          `;

        } else {

          imageHTML = `
            <div class="no-image">
              No Product Image
            </div>
          `;

        }


        let galleryHTML = "";


        if (
          product.gallery &&
          product.gallery.length > 0
        ) {

          galleryHTML = `
            <div class="gallery">
          `;


          product.gallery.forEach(
            function(image) {

              galleryHTML += `
                <img
                  src="${image}"
                  alt="Gallery"
                >
              `;

            }
          );


          galleryHTML += `
            </div>
          `;

        }


        card.innerHTML = `

          ${imageHTML}

          <h3>
            ${escapeHTML(product.name || "Product")}
          </h3>

          <div class="badges">
            ${badges}
          </div>

          <div class="product-info">

            <div>
              <strong>Price:</strong>
              ₹${escapeHTML(product.price || "0")}
            </div>

            <div>
              <strong>Discount:</strong>
              ${escapeHTML(product.discount || "0")}%
            </div>

            <div>
              <strong>Estimated Profit:</strong>
              ${escapeHTML(product.profit || "Not set")}
            </div>

            <div>
              <strong>Category:</strong>
              ${escapeHTML(product.category || "Not set")}
            </div>

            <div>
              <strong>Rating:</strong>
              ⭐ ${escapeHTML(product.rating || "0")} / 5
            </div>

            <div>
              <strong>Description:</strong>
              ${escapeHTML(product.description || "No description")}
            </div>

          </div>

          ${galleryHTML}

          <div class="product-actions">

            <button
              class="btn view-btn"
              onclick="viewProduct(${index})"
            >
              👁️ View
            </button>

            <button
              class="btn edit-btn"
              onclick="editProduct(${index})"
            >
              ✏️ Edit Product
            </button>

            <button
              class="btn delete-btn"
              onclick="deleteProduct(${index})"
            >
              🗑️ Delete Product
            </button>

          </div>

        `;


        productList.appendChild(card);

      }
    );

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value == null ? "" : value;

    return div.innerHTML;

  }


  /* =========================================
     DELETE
  ========================================= */

  let deleteIndex = -1;


  function deleteProduct(index) {

    deleteIndex = index;

    document.getElementById(
      "deletePopup"
    ).style.display = "flex";

  }


  function closeDeletePopup() {

    deleteIndex = -1;

    document.getElementById(
      "deletePopup"
    ).style.display = "none";

  }


  function confirmDelete() {

    if (deleteIndex === -1) {
      return;
    }


    const deletedProduct =
      products[deleteIndex];


    products.splice(
      deleteIndex,
      1
    );


    localStorage.setItem(
      "adminProducts",
      JSON.stringify(products)
    );


    /*
      Keep customer page compatible.
    */

    const currentProduct =
      JSON.parse(
        localStorage.getItem("adminProduct")
      );


    if (
      currentProduct &&
      deletedProduct &&
      currentProduct.id === deletedProduct.id
    ) {

      if (products.length > 0) {

        localStorage.setItem(
          "adminProduct",
          JSON.stringify(
            products[products.length - 1]
          )
        );

      } else {

        localStorage.removeItem(
          "adminProduct"
        );

      }

    }


    closeDeletePopup();

    displayProducts();

  }


  /* =========================================
     EDIT
  ========================================= */

  let editIndex = -1;


  function editProduct(index) {

    editIndex = index;

    const product =
      products[index];


    if (!product) {
      return;
    }


    document.getElementById(
      "editName"
    ).value =
      product.name || "";


    document.getElementById(
      "editPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "editDiscount"
    ).value =
      product.discount || "";


    document.getElementById(
      "editProfit"
    ).value =
      product.profit || "";


    document.getElementById(
      "editCategory"
    ).value =
      product.category || "Home & Kitchen";


    document.getElementById(
      "editRating"
    ).value =
      product.rating || "";


    document.getElementById(
      "editDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "editTrending"
    ).checked =
      product.trending === true;


    document.getElementById(
      "editHot"
    ).checked =
      product.hot === true;


    document.getElementById(
      "editNewest"
    ).checked =
      product.newest === true;


    document.getElementById(
      "editImage"
    ).value = "";


    document.getElementById(
      "editGallery"
    ).value = "";


    document.getElementById(
      "editModal"
    ).style.display = "flex";

  }


  function closeEditModal() {

    editIndex = -1;

    document.getElementById(
      "editModal"
    ).style.display = "none";

  }


  function saveEditedProduct() {

    if (editIndex === -1) {
      return;
    }


    const product =
      products[editIndex];


    const name =
      document.getElementById(
        "editName"
      ).value.trim();


    if (!name) {

      alert(
        "Please enter product name."
      );

      return;

    }


    product.name =
      name;


    product.price =
      document.getElementById(
        "editPrice"
      ).value;


    product.discount =
      document.getElementById(
        "editDiscount"
      ).value;


    product.profit =
      document.getElementById(
        "editProfit"
      ).value;


    product.category =
      document.getElementById(
        "editCategory"
      ).value;


    product.rating =
      document.getElementById(
        "editRating"
      ).value;


    product.description =
      document.getElementById(
        "editDescription"
      ).value;


    product.trending =
      document.getElementById(
        "editTrending"
      ).checked;


    product.hot =
      document.getElementById(
        "editHot"
      ).checked;


    product.newest =
      document.getElementById(
        "editNewest"
      ).checked;


    const imageFile =
      document.getElementById(
        "editImage"
      ).files[0];


    const galleryFiles =
      document.getElementById(
        "editGallery"
      ).files;


    let totalFiles =
      (imageFile ? 1 : 0) +
      galleryFiles.length;


    let completed = 0;


    function finishEdit() {

      localStorage.setItem(
        "adminProducts",
        JSON.stringify(products)
      );


      /*
        Update latest product
        for customer page compatibility.
      */

      const currentProduct =
        JSON.parse(
          localStorage.getItem("adminProduct")
        );


      if (
        currentProduct &&
        currentProduct.id === product.id
      ) {

        localStorage.setItem(
          "adminProduct",
          JSON.stringify(product)
        );

      }


      closeEditModal();

      displayProducts();

      alert(
        "Product updated successfully!"
      );

    }


    /*
      No new image or gallery
    */

    if (totalFiles === 0) {

      finishEdit();

      return;

    }


    /*
      New main image
    */

    if (imageFile) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          product.image =
            reader.result;

          completed++;


          if (
            completed === totalFiles
          ) {

            finishEdit();

          }

        };


      reader.readAsDataURL(
        imageFile
      );

    }


    /*
      New gallery images
    */

    if (
      galleryFiles.length > 0
    ) {

      product.gallery = [];


      for (
        let i = 0;
        i < galleryFiles.length;
        i++
      ) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            product.gallery.push(
              reader.result
            );


            completed++;


            if (
              completed === totalFiles
            ) {

              finishEdit();

            }

          };


        reader.readAsDataURL(
          galleryFiles[i]
        );

      }

    }

  }


  /* =========================================
     VIEW PRODUCT
  ========================================= */

  function viewProduct(index) {

    const product =
      products[index];


    if (!product) {
      return;
    }


    document.getElementById(
      "viewName"
    ).textContent =
      product.name || "Product";


    const viewImage =
      document.getElementById(
        "viewImage"
      );


    if (product.image) {

      viewImage.src =
        product.image;

      viewImage.style.display =
        "block";

    } else {

      viewImage.style.display =
        "none";

    }


    document.getElementById(
      "viewPrice"
    ).textContent =
      "₹" + (product.price || "0");


    document.getElementById(
      "viewDiscount"
    ).textContent =
      (product.discount || "0") + "%";


    document.getElementById(
      "viewProfit"
    ).textContent =
      product.profit || "Not set";


    document.getElementById(
      "viewCategory"
    ).textContent =
      product.category || "Not set";


    document.getElementById(
      "viewRating"
    ).textContent =
      (product.rating || "0") + " / 5";


    document.getElementById(
      "viewDescription"
    ).textContent =
      product.description || "No description";


    let status = [];


    if (product.trending) {
      status.push("🔥 Trending");
    }


    if (product.hot) {
      status.push("🔥 Hot");
    }


    if (product.newest) {
      status.push("🆕 Newest");
    }


    document.getElementById(
      "viewStatus"
    ).textContent =
      status.length > 0
        ? status.join(" | ")
        : "No special status";


    const gallery =
      document.getElementById(
        "viewGallery"
      );


    gallery.innerHTML = "";


    if (
      product.gallery &&
      product.gallery.length > 0
    ) {

      product.gallery.forEach(
        function(image) {

          const img =
            document.createElement("img");

          img.src =
            image;

          img.alt =
            "Gallery";

          gallery.appendChild(
            img
          );

        }
      );

    }


    document.getElementById(
      "viewModal"
    ).style.display = "flex";

  }


  function closeViewModal() {

    document.getElementById(
      "viewModal"
    ).style.display = "none";

  }


  /* =========================================
     START
  ========================================= */

  displayProducts();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect WhatsApp - Product HUD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
    }

    .back-btn {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 55px;
      text-align: center;
      margin-bottom: 15px;
    }

    h2 {
      text-align: center;
      color: #111827;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #15803d;
    }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #f0fdf4;
      color: #166534;
      display: none;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>📱 Connect WhatsApp</h1>
    <a href="admin.html" class="back-btn">← Dashboard</a>
  </header>

  <main class="container">

    <div class="card">

      <div class="icon">📱</div>

      <h2>WhatsApp Settings</h2>

      <p class="description">
        Add your WhatsApp number to receive customer order messages.
      </p>

      <label for="whatsappNumber">
        WhatsApp Number
      </label>

      <input
        type="tel"
        id="whatsappNumber"
        placeholder="Example: 919876543210"
      >

      <button
        class="save-btn"
        onclick="saveWhatsApp()"
      >
        💾 Save WhatsApp Number
      </button>

      <div id="status" class="status">
        ✅ WhatsApp number saved successfully!
      </div>

    </div>

  </main>

  <script>

    const savedNumber =
      localStorage.getItem("whatsappNumber");

    if (savedNumber) {
      document.getElementById("whatsappNumber").value =
        savedNumber;
    }

    function saveWhatsApp() {

      const number =
        document.getElementById("whatsappNumber").value.trim();

      if (!number) {
        alert("Please enter WhatsApp number.");
        return;
      }

      localStorage.setItem(
        "whatsappNumber",
        number
      );

      document.getElementById("status").style.display =
        "block";
    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order Now - Product HUD</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

</head>

<body>

  <main class="cart-page">

    <h1>Order Now</h1>

    <div id="orderProduct">
      <p>Loading product...</p>
    </div>

  </main>


<script>

document.addEventListener("DOMContentLoaded", function () {

  const orderProduct =
    document.getElementById("orderProduct");

  const cartProduct =
    JSON.parse(
      localStorage.getItem("cartProduct")
    );


  /* ================================
     CHECK PRODUCT
  ================================= */

  if (!cartProduct) {

    orderProduct.innerHTML =
      "<p>No product selected.</p>";

    return;

  }


  /* ================================
     DISPLAY ORDER PAGE
  ================================= */

  orderProduct.innerHTML = `

    <div class="saved-product-card">

      <img
        src="${cartProduct.image || ""}"
        alt="${cartProduct.name || "Product"}"
        style="width:200px; max-width:100%;"
      >

      <h2>
        ${cartProduct.name || "Product"}
      </h2>

      <p>
        Price: ₹${cartProduct.price || "0"}
      </p>


      <h3>Delivery Details</h3>


      <input
        id="customerName"
        type="text"
        placeholder="Full Name"
      >


      <input
        id="customerPhone"
        type="text"
        placeholder="Phone Number"
      >


      <input
        id="customerAddress"
        type="text"
        placeholder="Delivery Address"
      >


      <input
        id="customerCity"
        type="text"
        placeholder="City"
      >


      <input
        id="customerPin"
        type="text"
        placeholder="PIN Code"
      >


      <h3>Payment Method</h3>


      <label>

        <input
          type="radio"
          name="payment"
          value="cod"
          checked
        >

        Cash on Delivery

      </label>


      <label>

        <input
          type="radio"
          name="payment"
          value="online"
        >

        Online Payment

      </label>


      <h3>Order Summary</h3>


      <p>
        <strong>Product:</strong>
        ${cartProduct.name || "Product"}
      </p>


      <p>
        <strong>Price:</strong>
        ₹${cartProduct.price || "0"}
      </p>


      <p>
        <strong>Delivery:</strong>
        Free
      </p>


      <hr>


      <p>
        <strong>Total:</strong>
        ₹${cartProduct.price || "0"}
      </p>


      <button
        id="placeOrderBtn"
        type="button"
      >
        Place Order
      </button>

    </div>

  `;


  /* ================================
     PLACE ORDER
  ================================= */

  const placeOrderBtn =
    document.getElementById("placeOrderBtn");


  placeOrderBtn.addEventListener(
    "click",
    async function () {


      const name =
        document
          .getElementById("customerName")
          .value
          .trim();


      const phone =
        document
          .getElementById("customerPhone")
          .value
          .trim();


      const address =
        document
          .getElementById("customerAddress")
          .value
          .trim();


      const city =
        document
          .getElementById("customerCity")
          .value
          .trim();


      const pin =
        document
          .getElementById("customerPin")
          .value
          .trim();


      const payment =
        document.querySelector(
          'input[name="payment"]:checked'
        ).value;


      /* ================================
         VALIDATION
      ================================= */

      if (
        !name ||
        !phone ||
        !address ||
        !city ||
        !pin
      ) {

        alert(
          "Please fill in all delivery details."
        );

        return;

      }


      /* ================================
         ORDER OBJECT
      ================================= */

      const newOrder = {

        id: Date.now(),

        product: cartProduct,

        customer: {

          name: name,

          phone: phone,

          address: address,

          city: city,

          pin: pin

        },

        payment: payment,

        status: "New Order",

        date:
          new Date().toLocaleString()

      };


      /* ================================
         SAVE LOCAL BACKUP
      ================================= */

      localStorage.setItem(
        "myOrder",
        JSON.stringify(newOrder)
      );


      let myOrders =
        JSON.parse(
          localStorage.getItem("myOrders")
        ) || [];


      myOrders.push(newOrder);


      localStorage.setItem(
        "myOrders",
        JSON.stringify(myOrders)
      );


      /* ================================
         SAVE TO SUPABASE
      ================================= */

      try {

        const { data, error } =
          await supabaseClient
            .from("orders")
            .insert([

              {

                product_name:
                  cartProduct.name || "Product",

                product_price:
                  cartProduct.price || 0,

                product_image:
                  cartProduct.image || "",

                customer_name:
                  name,

         customer_phone:
                  phone,

                address:
                  address,

                city:
                  city,

                pin:
                  pin,

                payment_method:
                  payment,

                status:
                  "New Order"

              }

            ]);
            


        if (error) {

          console.error(
            "Supabase Order Error:",
            error
          );

          alert(
            "Order saved locally, but could not sync to server.\n\n" +
            error.message
          );

          return;

        }


        console.log(
          "Order saved to Supabase:",
          data
        );


        /* ================================
           SUCCESS
        ================================= */

        localStorage.removeItem(
          "cartProduct"
        );


        alert(
          "Order placed successfully!"
        );


        window.location.href =
          "order-success.html";


      }

      catch (error) {

        console.error(
          "Order Error:",
          error
        );


        alert(
          "Order could not be synced to server."
        );

      }

    }
  );

});

</script>

</body>
</html>
